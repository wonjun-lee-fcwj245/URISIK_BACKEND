# 실험 23: ES 서킷을 덜 민감하게(창 10 → 50건, 최소 5 → 20건, 느린 호출 500ms → 1초, 느린 호출 비율 80%는 유지)
services:
  app:
    environment:
      - RESILIENCE4J_CIRCUITBREAKER_INSTANCES_ELASTICSEARCHAPI_SLIDING_WINDOW_SIZE=50
      - RESILIENCE4J_CIRCUITBREAKER_INSTANCES_ELASTICSEARCHAPI_MINIMUM_NUMBER_OF_CALLS=20
      - RESILIENCE4J_CIRCUITBREAKER_INSTANCES_ELASTICSEARCHAPI_SLOW_CALL_DURATION_THRESHOLD=1s
